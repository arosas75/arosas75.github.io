<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotería Mexicana — Cantador automático</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --papel: #F3F1EA;
    --tinta: #07074e;
    --magenta: #f15d2a;
    --marigold: #f15d2a;
    --teal: #005c90;
    --linea: rgba(7,7,78,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--tinta);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(241,93,42,0.16), transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(0,92,144,0.22), transparent 45%);
    color:var(--papel);
    font-family:'Libre Baskerville', Georgia, serif;
    min-height:100vh;
  }
  .marco{
    max-width:820px;
    margin:0 auto;
    padding:44px 20px 70px;
  }
  header{
    text-align:center;
    margin-bottom:34px;
  }
  header .logo-empresa{
    width:190px;
    margin:0 auto 22px;
    background:var(--papel);
    padding:14px 18px;
    border-radius:8px;
    display:inline-block;
  }
  header .logo-empresa svg{
    width:100%;
    height:auto;
    display:block;
  }
  header .ceja{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.06em;
    color:var(--marigold);
  }
  header h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:clamp(40px, 8vw, 68px);
    line-height:0.95;
    margin:4px 0 8px;
    color:var(--papel);
  }
  header p{
    color:rgba(244,233,210,0.65);
    font-size:15px;
    max-width:48ch;
    margin:0 auto;
  }

  .carta{
    background:var(--papel);
    color:var(--tinta);
    border:3px solid var(--tinta);
    border-radius:6px;
    padding:30px 28px;
    position:relative;
    box-shadow: 0 0 0 6px var(--papel), 0 0 0 9px var(--tinta);
    margin:0 auto 30px;
    max-width:420px;
    text-align:center;
    min-height:320px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition: transform .25s ease;
  }
  .carta.activa{ animation: aparece .35s ease; }
  @keyframes aparece{
    from{ transform: scale(0.92) rotate(-1.5deg); opacity:0.3; }
    to{ transform: scale(1) rotate(0deg); opacity:1; }
  }
  .carta .icono-grande{
    width:96px;
    height:96px;
    color:var(--magenta);
    margin-bottom:10px;
  }
  .carta .icono-grande svg{ width:100%; height:100%; }
  .carta .numero{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:22px;
    color:var(--magenta);
    letter-spacing:0.05em;
  }
  .carta .nombre{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:clamp(28px,6.5vw,38px);
    color:var(--tinta);
    margin:4px 0 14px;
    line-height:1;
  }
  .carta .canto{
    font-style:italic;
    font-size:16px;
    line-height:1.5;
    color:rgba(43,33,26,0.85);
    max-width:34ch;
  }
  .carta .placeholder{
    color:rgba(43,33,26,0.4);
    font-style:italic;
  }

  .controles{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  button{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.02em;
    padding:12px 26px;
    border-radius:4px;
    border:2px solid var(--papel);
    background:var(--magenta);
    color:var(--papel);
    cursor:pointer;
    transition:transform .08s ease, opacity .15s ease;
  }
  button.secundario{ background:transparent; border-color:rgba(244,233,210,0.4); color:var(--papel); }
  button:active{ transform:scale(0.96); }
  button:disabled{ opacity:0.35; cursor:default; }

  .ajustes{
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    margin:18px 0 8px;
    font-family:'Big Shoulders Display', sans-serif;
    font-size:13px;
  }
  .ajustes .campo{ display:flex; flex-direction:column; gap:4px; align-items:center;}
  .ajustes select, .ajustes input[type=range]{ font-family:inherit; }
  select{
    background:transparent;
    color:var(--papel);
    border:none;
    border-bottom:1.5px solid var(--papel);
    padding:4px 2px;
  }
  select option{ color:var(--tinta); }

  .estado{
    text-align:center;
    font-size:13px;
    color:rgba(244,233,210,0.55);
    margin-bottom:26px;
    min-height:18px;
  }

  .tabla{
    display:grid;
    grid-template-columns:repeat(9, 1fr);
    gap:6px;
    max-width:560px;
    margin:0 auto;
  }
  .casilla{
    aspect-ratio:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px solid rgba(244,233,210,0.3);
    border-radius:3px;
    color:rgba(244,233,210,0.5);
    overflow:hidden;
  }
  .casilla .num{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:600;
    font-size:13px;
  }
  .casilla .mini-icono{
    display:none;
    width:60%;
    height:60%;
  }
  .casilla .mini-icono svg{ width:100%; height:100%; }
  .casilla .etiqueta{
    position:absolute;
    bottom:1px;
    right:3px;
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:9px;
  }
  .casilla.cantada{
    background:var(--teal);
    border-color:var(--teal);
    color:var(--papel);
  }
  .casilla.actual{
    background:var(--marigold);
    border-color:var(--marigold);
    color:var(--tinta);
  }
  .casilla.cantada .num, .casilla.actual .num{ display:none; }
  .casilla.cantada .mini-icono, .casilla.actual .mini-icono{ display:block; }

  @media (max-width:480px){
    .tabla{ grid-template-columns:repeat(6,1fr); }
  }
</style>
</head>

  </header>

  <div class="carta" id="carta">
    <div class="placeholder">Presiona "Iniciar lotería" para comenzar</div>
  </div>

  <div class="controles">
    <button id="btnIniciar">Iniciar lotería</button>
    <button id="btnPausar" class="secundario" disabled>Pausar</button>
    <button id="btnReiniciar" class="secundario">Reiniciar mazo</button>
  </div>

  <div class="ajustes">
    <div class="campo">
      <label for="voz">Voz</label>
      <select id="voz"></select>
    </div>
    <div class="campo">
      <label for="espera">Pausa entre cartas</label>
      <select id="espera">
        <option value="3000">3 seg</option>

const cartaEl = document.getElementById('carta');
const btnIniciar = document.getElementById('btnIniciar');
const btnPausar = document.getElementById('btnPausar');
const btnReiniciar = document.getElementById('btnReiniciar');
const vozEl = document.getElementById('voz');
const esperaEl = document.getElementById('espera');
const estadoEl = document.getElementById('estado');
const tablaEl = document.getElementById('tabla');

let vocesEs = [];
let mazo = [];
let indiceActual = -1;
let pausado = false;
let enCurso = false;
let temporizador = null;

// Construir la tabla visual de 54 casillas (número + ícono oculto hasta que se cante)
for(let i=1;i<=54;i++){
  const c = document.createElement('div');
  c.className = 'casilla';
  c.id = 'casilla-'+i;
  c.innerHTML = `<span class="num">${i}</span><span class="mini-icono">${ICONOS[i]}</span><span class="etiqueta">${i}</span>`;
  tablaEl.appendChild(c);
}

function cargarVoces(){
  const todas = speechSynthesis.getVoices();
  vocesEs = todas.filter(v => v.lang.toLowerCase().startsWith('es'));
  vozEl.innerHTML = '';
  if(vocesEs.length === 0){
    const opt = document.createElement('option');
    opt.textContent = 'Voz predeterminada del sistema';
    vozEl.appendChild(opt);
    return;
  }
  vocesEs.forEach((v,i)=>{
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${v.name} (${v.lang})`;
    vozEl.appendChild(opt);
  });
}
speechSynthesis.onvoiceschanged = cargarVoces;
cargarVoces();

function barajar(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function hablar(texto, callback){
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(texto);
  if(vocesEs.length){
    utter.voice = vocesEs[vozEl.value] || vocesEs[0];
  }
  utter.lang = 'es-419';
  utter.rate = 1;
  utter.onend = callback;
  utter.onerror = callback;
  speechSynthesis.speak(utter);
}

function mostrarCarta(item){
  cartaEl.classList.remove('activa');
  void cartaEl.offsetWidth; // reinicia animación
  cartaEl.innerHTML = `
    <div class="icono-grande">${ICONOS[item.n]}</div>
    <div class="nombre">${item.carta}</div>
    <div class="canto">"${item.canto}"</div>
  `;
  cartaEl.classList.add('activa');
}

function marcarCasilla(n, tipo){
  document.querySelectorAll('.casilla.actual').forEach(c=>c.classList.remove('actual'));
  const c = document.getElementById('casilla-'+n);
  if(c) c.classList.add(tipo);
}

function actualizarEstado(){
  const restantes = mazo.length - (indiceActual+1);
  estadoEl.textContent = `Carta ${indiceActual+1} de ${mazo.length} · quedan ${restantes} por cantar`;
}

function siguienteCarta(){
  if(pausado || !enCurso) return;
  indiceActual++;
  if(indiceActual >= mazo.length){
    estadoEl.textContent = '¡Se acabó el mazo! Lotería completa';
    enCurso = false;
    btnIniciar.disabled = false;
    btnIniciar.textContent = 'Jugar otra vez';
    btnPausar.disabled = true;
    return;
  }
  const item = mazo[indiceActual];
  mostrarCarta(item);
  marcarCasilla(item.n, 'actual');
  actualizarEstado();

  hablar(`${item.canto} ${item.carta}.`, ()=>{
    marcarCasilla(item.n, 'cantada');
    document.getElementById('casilla-'+item.n).classList.remove('actual');
    document.getElementById('casilla-'+item.n).classList.add('cantada');
    if(enCurso && !pausado){
      temporizador = setTimeout(siguienteCarta, parseInt(esperaEl.value));
    }
  });
}

function iniciarMazo(){
  mazo = barajar(DATOS);
  indiceActual = -1;
  document.querySelectorAll('.casilla').forEach(c=> c.classList.remove('cantada','actual'));
  cartaEl.innerHTML = '<div class="placeholder">Presiona "Iniciar lotería" para comenzar</div>';
  estadoEl.textContent = '';
}

btnIniciar.addEventListener('click', ()=>{
  if(mazo.length === 0 || indiceActual >= mazo.length){
    iniciarMazo();
  }
  enCurso = true;
  pausado = false;
  btnIniciar.disabled = true;
  btnPausar.disabled = true; // se habilita cuando arranca la primera carta
  btnPausar.textContent = 'Pausar';
  estadoEl.textContent = 'Preparando la baraja...';

  hablar('¡Corre y se va corriendo!', ()=>{
    if(!enCurso || pausado) return;
    btnPausar.disabled = false;
    siguienteCarta();
  });
});

btnPausar.addEventListener('click', ()=>{
  if(!enCurso) return;
  pausado = !pausado;
  if(pausado){
    clearTimeout(temporizador);
    speechSynthesis.cancel();
    btnPausar.textContent = 'Reanudar';
    estadoEl.textContent += ' · en pausa';
    hablar('¡LOTERÍA!', ()=>{});
  } else {
    btnPausar.textContent = 'Pausar';
    temporizador = setTimeout(siguienteCarta, 300);
  }
});

btnReiniciar.addEventListener('click', ()=>{
  clearTimeout(temporizador);
  speechSynthesis.cancel();
  enCurso = false;
  pausado = false;
  btnIniciar.disabled = false;
  btnIniciar.textContent = 'Iniciar lotería';
  btnPausar.disabled = true;
  iniciarMazo();
});
</script>
